# Secondo scheduler, in parallelo a cron-job.org.
#
# Non lo sostituisce: lo affianca. /api/cron/poll decide da sé quanto lavoro
# fare — il giro pieno a 2 minuti in movimento, 5 da fermo, 15 a sosta lunga;
# nel mezzo una sonda da una chiamata sola che risponde "sonda" quando non è
# cambiato niente, e fa scattare il giro pieno appena cambia qualcosa. Chiamare
# due volte non raddoppia nulla, quindi la ridondanza non costa niente e
# nessuno dei due scheduler deve essere affidabile da solo.
#
# Serve perché cron-job.org si è fermato in silenzio due volte, e in entrambi i
# casi ce ne siamo accorti per caso. Qui la pianificazione sta nel repository:
# si vede nei diff, le esecuzioni sono nella scheda Actions, e i fallimenti
# arrivano per email invece di sparire in un pannello che nessuno apre.
#
# Limiti da conoscere, perché li ha:
#   - il minimo è 5 minuti, non 1: da solo perderebbe la cadenza da 2 minuti
#     che serve durante un viaggio, ed è un altro motivo per tenerli entrambi
#   - GitHub ritarda le esecuzioni pianificate sotto carico, e quando è molto
#     carico ne scarta: all'inizio di ogni ora capita
#   - su repository pubblici GitHub disattiva i workflow pianificati dopo 60
#     giorni senza attività, ma lo annuncia per email. È il tipo di guasto che
#     si può vedere arrivare, al contrario di quello che ci ha colpiti.
#   - la pianificazione si registra al push del file sul branch di default, e
#     la prima registrazione può non avvenire affatto: è successo qui — un'ora
#     senza giri, con gli avvii manuali perfettamente funzionanti. Il rimedio
#     è un push qualsiasi che tocchi questo file, come quello che ha aggiunto
#     questa riga. Se ricapita, questo è il motivo.

name: Poll Volvo

on:
  schedule:
    - cron: '*/5 * * * *'
  # Per provarlo subito dalla scheda Actions senza aspettare il prossimo giro
  workflow_dispatch:

# Un poll alla volta: se GitHub accoda esecuzioni in ritardo, non ha senso
# scaricarle tutte insieme sull'endpoint.
concurrency:
  group: poll-volvo
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chiama /api/cron/poll
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then
            echo "::error::Manca il secret CRON_SECRET nelle impostazioni del repository."
            exit 1
          fi

          corpo=$(mktemp)
          codice=$(curl -sS --max-time 60 -o "$corpo" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            https://lagom-drive.vercel.app/api/cron/poll)

          echo "HTTP $codice"
          cat "$corpo"
          echo

          # Lo stato HTTP dice solo se la richiesta è stata gestita. Un 401 o un
          # 500 sono guasti veri; la salute della raccolta no, quella sta nel
          # corpo, perché l'endpoint deve poter dire "sono in allarme" senza che
          # uno scheduler lo interpreti come "smetti di chiamarmi".
          if [ "$codice" != "200" ]; then
            echo "::error::L'endpoint ha risposto $codice"
            exit 1
          fi

          # Qui invece il fallimento è voluto: GitHub manda una email a ogni
          # passo fallito ma continua a pianificare il workflow, quindi è il
          # posto giusto dove far uscire l'allarme.
          #
          # Si allarma solo su un false esplicito, non su "diverso da true":
          # fra il merge di questo file e il deploy che aggiunge il campo passa
          # qualche minuto in cui la risposta non ha `healthy`, e non è un
          # guasto. Da notare che qui `jq //` non si può usare: in jq anche
          # false è vuoto, quindi `.healthy // "assente"` maschererebbe proprio
          # il caso da intercettare.
          if [ "$(jq -r '.healthy' "$corpo")" = "false" ]; then
            echo "::error::Raccolta in allarme: $(jq -r '.alert // "sconosciuto"' "$corpo")" \
                 "— ultimo dato $(jq -r '.lastDataMinutesAgo // "mai"' "$corpo") min fa"
            exit 1
          fi
